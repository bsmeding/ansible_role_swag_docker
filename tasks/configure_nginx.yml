---
# Tasks to configure Nginx (site and proxy configs)

# Per-site GeoIP maps (swag-dbip/swag-maxmind provides geoip2 lookup in dbip.conf/maxmind.conf)
- name: Build GeoIP site list from template proxy entries
  ansible.builtin.set_fact:
    swag__geoip_sites_effective: "{{ swag__geoip_sites_effective | default([]) + [geoip_entry] }}"
  loop: "{{ swag__proxy_confs_subdomain | default([]) }}"
  when: item.geoip is defined
  vars:
    geoip_entry:
      server_name: "{{ item.server_name }}"
      mode: "{{ item.geoip.mode | default('blacklist') }}"
      countries: "{{ item.geoip.countries | default([]) }}"
      deny_code: "{{ item.geoip.deny_code | default(swag__geoip_deny_http_code | default(403)) }}"
  loop_control:
    label: "{{ item.server_name }}"

- name: Add manual GeoIP sites to effective list
  ansible.builtin.set_fact:
    swag__geoip_sites_effective: "{{ swag__geoip_sites_effective | default([]) + (swag__geoip_sites | default([])) }}"
  when: swag__geoip_sites | default([]) | length > 0

- name: Ensure GeoIP maps directory exists
  ansible.builtin.file:
    path: "{{ swag__home }}/config/nginx/geoip-maps.d"
    state: directory
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0750'
  when: swag__geoip_sites_effective | default([]) | length > 0

- name: Deploy per-site GeoIP map files
  ansible.builtin.template:
    src: geoip-maps/site.conf.j2
    dest: "{{ swag__home }}/config/nginx/geoip-maps.d/{{ item.server_name }}.conf"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0640'
  loop: "{{ swag__geoip_sites_effective | default([]) }}"
  vars:
    geoip_site: "{{ item }}"
  when: swag__geoip_sites_effective | default([]) | length > 0
  notify: restart swag

- name: Deploy http-level include for per-site GeoIP maps
  ansible.builtin.copy:
    src: nginx/geoip-maps-http.conf
    dest: "{{ swag__home }}/config/nginx/geoip-maps-http.conf"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0640'
  when: swag__geoip_sites_effective | default([]) | length > 0
  notify: restart swag

- name: Check GeoIP provider config files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ swag__home }}/config/nginx/dbip.conf"
    - "{{ swag__home }}/config/nginx/maxmind.conf"
  register: swag__geoip_provider_config_stats
  when: swag__geoip_sites_effective | default([]) | length > 0

- name: Read GeoIP provider configs
  ansible.builtin.slurp:
    path: "{{ item.stat.path }}"
  loop: "{{ swag__geoip_provider_config_stats.results | default([]) | selectattr('stat.exists') | list }}"
  register: swag__geoip_provider_config_contents
  when: swag__geoip_sites_effective | default([]) | length > 0

- name: Enable per-site GeoIP maps in provider config
  ansible.builtin.blockinfile:
    path: "{{ item.item.stat.path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - per-site GeoIP maps"
    block: "include /config/nginx/geoip-maps-http.conf;"
  loop: "{{ swag__geoip_provider_config_contents.results | default([]) }}"
  when:
    - swag__geoip_sites_effective | default([]) | length > 0
    - item.content is defined
    - "'include /config/nginx/geoip-maps-http.conf;' not in (item.content | b64decode)"
  loop_control:
    label: "{{ item.item.stat.path | default(item.item) }}"
  notify: restart swag

- name: Fail when no GeoIP provider config exists
  ansible.builtin.fail:
    msg: >-
      GeoIP sites are configured, but neither {{ swag__home }}/config/nginx/dbip.conf nor
      {{ swag__home }}/config/nginx/maxmind.conf exists. Enable linuxserver/mods:swag-dbip
      or linuxserver/mods:swag-maxmind and make sure the SWAG container has initialized it.
  when:
    - swag__geoip_sites_effective | default([]) | length > 0
    - (swag__geoip_provider_config_stats.results | default([]) | selectattr('stat.exists') | list | length) == 0

- name: Set GeoIP provider include path for nginx.conf
  ansible.builtin.set_fact:
    swag__geoip_provider_include: "/config/nginx/{{ (swag__geoip_provider_config_stats.results | default([]) | selectattr('stat.exists') | map(attribute='item') | map('basename') | list | first) }}"
  when:
    - swag__geoip_sites_effective | default([]) | length > 0
    - (swag__geoip_provider_config_stats.results | default([]) | selectattr('stat.exists') | list | length) > 0

- name: Read nginx.conf for GeoIP provider include check
  ansible.builtin.slurp:
    path: "{{ swag__home }}/config/nginx/nginx.conf"
  register: swag__nginx_conf_slurp
  when:
    - swag__geoip_sites_effective | default([]) | length > 0
    - swag__geoip_provider_include is defined

- name: Enable GeoIP provider in nginx.conf
  ansible.builtin.blockinfile:
    path: "{{ swag__home }}/config/nginx/nginx.conf"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - GeoIP provider"
    insertafter: '^http \{'
    block: "    include {{ swag__geoip_provider_include }};"
  when:
    - swag__geoip_sites_effective | default([]) | length > 0
    - swag__geoip_provider_include is defined
    - swag__nginx_conf_slurp.content is defined
    - "swag__geoip_provider_include not in (swag__nginx_conf_slurp.content | b64decode)"
  notify: restart swag

# Check if config files are present in ./files/nginx/proxy-confs/
# - name: Find .conf files in ./files/nginx/proxy-confs/
#   ansible.builtin.find:
#     paths: "{{ playbook_dir }}/files/nginx/proxy-confs/"
#     patterns: "*.conf"
#   register: local_proxy_confs_files
#   delegate_to: localhost

# Proxy confs must end in subdomain.conf to auto load (hide logs as proxy conf can have ssl passwords)
- name: Generate proxy confs from swag__proxy_confs_subdomain variable
  ansible.builtin.template:
    src: proxy-confs/template_subdomain.conf.j2
    dest: "{{ swag__home }}/config/nginx/proxy-confs/{{ item.server_name }}.subdomain.conf"
    owner: "{{ item.owner | default(docker_uid | default(1040)) }}"
    group: "{{ item.group | default(docker_gid | default(1001)) }}"
  loop: "{{ swag__proxy_confs_subdomain }}"
  notify: restart swag
  when: swag__proxy_confs_subdomain is defined and swag__proxy_confs_subdomain|length>0
  no_log: "{{ swag__hide_sensitive_logs }}"

- name: Find files in {{ playbook_dir }}/files/nginx/proxy-confs/
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/nginx/proxy-confs/"
    patterns: "*"
  register: local_proxy_confs_files
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

- name: "Copy local proxy-confs if exists in {{ playbook_dir }}/files/nginx/proxy-confs/"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ swag__home }}/config/nginx/proxy-confs/{{ item.path | basename }}"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0640'
  loop: "{{ local_proxy_confs_files.files | default([]) }}"
  when:
    - local_proxy_confs_files is defined
    - local_proxy_confs_files.files is defined
    - local_proxy_confs_files.files | length > 0
  notify: restart swag

- name: Find files in {{ playbook_dir }}/files/nginx/site-confs/
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/nginx/site-confs/"
    patterns: "*"
  register: local_site_confs_files
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

- name: "Copy local site-confs if exists in {{ playbook_dir }}/files/nginx/site-confs/"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ swag__home }}/config/nginx/site-confs/{{ item.path | basename }}"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0640'
  loop: "{{ local_site_confs_files.files | default([]) }}"
  when:
    - local_site_confs_files is defined
    - local_site_confs_files.files is defined
    - local_site_confs_files.files | length > 0
  notify: restart swag

- name: Find files in {{ playbook_dir }}/files/nginx/sites/
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/nginx/sites/"
    patterns: "*"
  register: local_sites_files
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

- name: "Copy websites from ./files/nginx/sites/<subfolder> to /var/www (if exists)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/nginx/sites/"
    dest: "/var/www"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0740'
  when: local_sites_files is defined and local_sites_files.files is defined and local_sites_files.files | length > 0
  notify: restart swag

# Set DNS config, currently only cloudflare
- name: set dns config for Cloudflare
  ansible.builtin.template:
    src: dns-conf/cloudflare.ini.j2
    dest: "{{ swag__home }}/config/dns-conf/cloudflare.ini"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
  when: (swag__cloudflare_global_email is defined and swag__cloudflare_global_api is defined) or swag__cloudflare_api_token is defined
  notify: restart swag

# Copy Tailscale real IP configuration
- name: Copy Tailscale real IP configuration
  ansible.builtin.template:
    src: tailscale-real-ip.conf.j2
    dest: "{{ swag__home }}/config/nginx/tailscale-real-ip.conf"
    owner: "{{ docker_uid | default(1040) }}"
    group: "{{ docker_gid | default(1001) }}"
    mode: '0640'
  when: swag__enable_tailscale_real_ip | default(false) | bool
  notify: restart swag

